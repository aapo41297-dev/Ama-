name: Build Pageant Coach APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Find Android project
        shell: bash
        run: |
          set -e
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

          # If the project was uploaded as a ZIP, extract it.
          mkdir -p _extracted
          for zipfile in $(find . -maxdepth 3 -type f -iname '*.zip' -print); do
            echo "Extracting $zipfile"
            unzip -o "$zipfile" -d _extracted
          done

          # Find the directory containing settings.gradle/settings.gradle.kts.
          PROJECT_DIR=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts was found."
            echo "Upload the extracted PageantCoach project files (not only the ZIP), then run this workflow again."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pageant-Coach-V1-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
