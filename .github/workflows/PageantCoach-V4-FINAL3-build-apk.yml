          @Composable
          fun ScoresScreen(onBack: () -> Unit) {
              val criteria = listOf(
                  "Confidence",
                  "Communication",
                  "Stage Presence",
                  "Interview",
                  "Leadership",
                  "Elegance",
                  "Advocacy",
                  "Community Service"
              )

              Column(Modifier.fillMaxSize().padding(20.dp)) {
                  PageHeader(
                      "Scores & Assessment",
                      "Evaluate contestant performance",
                      onBack
                  )
                  Spacer(Modifier.height(18.dp))
                  Card(
                      shape = RoundedCornerShape(24.dp),
                      colors = CardDefaults.cardColors(containerColor = SoftPurple)
                  ) {
                      Column(Modifier.padding(20.dp)) {
                          Text(
                              "Assessment",
                              fontWeight = FontWeight.Bold,
                              color = Purple
                          )
                          Text(
                              "Select a contestant to begin scoring.",
                              color = DeepPurple,
                              fontSize = 16.sp
                          )
                      }
                  }
