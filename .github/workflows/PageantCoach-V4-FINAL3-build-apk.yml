name: Build Pageant Coach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Create Pageant Coach project
        run: |
          mkdir -p app/src/main/java/com/amali/pageantcoach
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PageantCoach"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
              id 'org.jetbrains.kotlin.android' version '2.3.20' apply false
              id 'org.jetbrains.kotlin.plugin.compose' version '2.3.20' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'org.jetbrains.kotlin.plugin.compose'
          }

          android {
              namespace 'com.amali.pageantcoach'
              compileSdk 36

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId 'com.amali.pageantcoach.v4'
                  minSdk 24
                  targetSdk 36
                  versionCode 4
                  versionName '4.0'
              }

              buildFeatures {
                  compose true
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.17.0"
              implementation "androidx.activity:activity-compose:1.12.4"
              implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
              implementation "androidx.compose.ui:ui:1.11.4"
              implementation "androidx.compose.ui:ui-tooling-preview:1.11.4"
              implementation "androidx.compose.material3:material3:1.4.0"
              debugImplementation "androidx.compose.ui:ui-tooling:1.11.4"
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Pageant Coach V4</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#24113F</item>
                  <item name="android:navigationBarColor">#10091C</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Pageant Coach V4"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/amali/pageantcoach/MainActivity.kt <<'EOF'
          package com.amali.pageantcoach

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private val Purple = Color(0xFF6C2BD9)
          private val DeepPurple = Color(0xFF281044)
          private val Pink = Color(0xFFE83E8C)
          private val Gold = Color(0xFFFFC857)
          private val SoftPurple = Color(0xFFF1E8FF)
          private val Background = Color(0xFFF8F6FB)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      PageantCoachTheme {
                          PageantCoachApp()
                      }
                  }
              }
          }

          @Composable
          fun PageantCoachTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = lightColorScheme(
                      primary = Purple,
                      secondary = Pink,
                      tertiary = Gold,
                      background = Background,
                      surface = Color.White,
                      primaryContainer = SoftPurple,
                      secondaryContainer = Color(0xFFFFE4F0)
                  ),
                  content = content
              )
          }

          enum class AppScreen {
              HOME, CONTESTANTS, TRAINING, PROJECTS, PROFILES,
              EVENTS, SCORES, REPORTS, SETTINGS
          }

          @Composable
          fun PageantCoachApp() {
              var screen by remember { mutableStateOf(AppScreen.HOME) }

              Scaffold(
                  containerColor = Background,
                  bottomBar = {
                      if (screen in listOf(
                              AppScreen.HOME,
                              AppScreen.CONTESTANTS,
                              AppScreen.TRAINING,
                              AppScreen.PROJECTS
                          )) {
                          NavigationBar(containerColor = Color.White) {
                              NavigationBarItem(
                                  selected = screen == AppScreen.HOME,
                                  onClick = { screen = AppScreen.HOME },
                                  icon = { Text("⌂", fontSize = 22.sp, color = Purple) },
                                  label = { Text("Home") }
                              )
                              NavigationBarItem(
                                  selected = screen == AppScreen.CONTESTANTS,
                                  onClick = { screen = AppScreen.CONTESTANTS },
                                  icon = { Text("♙", fontSize = 22.sp, color = Purple) },
                                  label = { Text("Contestants") }
                              )
                              NavigationBarItem(
                                  selected = screen == AppScreen.TRAINING,
                                  onClick = { screen = AppScreen.TRAINING },
                                  icon = { Text("🎓", fontSize = 20.sp) },
                                  label = { Text("Training") }
                              )
                              NavigationBarItem(
                                  selected = screen == AppScreen.PROJECTS,
                                  onClick = { screen = AppScreen.PROJECTS },
                                  icon = { Text("♥", fontSize = 22.sp, color = Pink) },
                                  label = { Text("Projects") }
                              )
                          }
                      }
                  }
              ) { padding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                  ) {
                      when (screen) {
                          AppScreen.HOME -> HomeScreen { screen = it }
                          AppScreen.CONTESTANTS -> ContestantsScreen { screen = AppScreen.HOME }
                          AppScreen.TRAINING -> TrainingScreen { screen = AppScreen.HOME }
                          AppScreen.PROJECTS -> ProjectsScreen { screen = AppScreen.HOME }
                          AppScreen.PROFILES -> ProfilesScreen { screen = AppScreen.HOME }
                          AppScreen.EVENTS -> EventsScreen { screen = AppScreen.HOME }
                          AppScreen.SCORES -> ScoresScreen { screen = AppScreen.HOME }
                          AppScreen.REPORTS -> ReportsScreen { screen = AppScreen.HOME }
                          AppScreen.SETTINGS -> SettingsScreen { screen = AppScreen.HOME }
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen(onNavigate: (AppScreen) -> Unit) {
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(20.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
