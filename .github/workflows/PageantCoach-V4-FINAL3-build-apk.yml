                  }

                  item {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          DashboardStat(
                              Modifier.weight(1f), "33", "Contestants",
                              "♙", Purple
                          )
                          DashboardStat(
                              Modifier.weight(1f), "08", "Events",
                              "▣", Pink
                          )
                      }
                  }

                  item {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          DashboardStat(
                              Modifier.weight(1f), "12", "Training",
                              "🎓", Color(0xFF00897B)
                          )
                          DashboardStat(
                              Modifier.weight(1f), "06", "Projects",
                              "♥", Color(0xFFE58A00)
                          )
                      }
                  }

                  item {
                      Text(
                          "Quick Actions",
                          fontSize = 20.sp,
                          fontWeight = FontWeight.Bold,
                          color = DeepPurple
                      )
                  }

                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          ActionCard(
                              "Contestant Profiles",
                              "Create and manage contestant information",
                              "●", Purple
                          ) { onNavigate(AppScreen.CONTESTANTS) }

                          ActionCard(
                              "Profiling & Scripts",
                              "Prepare introductions and advocacy scripts",
                              "♫", Pink
                          ) { onNavigate(AppScreen.PROFILES) }

                          ActionCard(
                              "Training & Coaching",
                              "Plan lessons and coaching sessions",
                              "🎓", Color(0xFF00897B)
                          ) { onNavigate(AppScreen.TRAINING) }

                          ActionCard(
                              "Events & Calendar",
                              "Track competitions and school activities",
                              "▣", Color(0xFFE58A00)
                          ) { onNavigate(AppScreen.EVENTS) }

                          ActionCard(
                              "Scores & Assessment",
                              "Assess confidence, communication and stage skills",
                              "★", Color(0xFFD81B60)
                          ) { onNavigate(AppScreen.SCORES) }

                          ActionCard(
                              "Go Girl Projects",
                              "Manage schools, support activities and projects",
                              "♥", Color(0xFF7B1FA2)
                          ) { onNavigate(AppScreen.PROJECTS) }

                          ActionCard(
                              "Reports",
                              "Prepare professional coaching and project reports",
                              "▤", Color(0xFF1565C0)
                          ) { onNavigate(AppScreen.REPORTS) }
                      }
                  }

                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(24.dp),
                          colors = CardDefaults.cardColors(
                              containerColor = Color(0xFFFFF6DD)
                          )
                      ) {
                          Row(
                              modifier = Modifier.padding(20.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  "💡",
                                  fontSize = 30.sp
                              )
                              Spacer(Modifier.width(14.dp))
                              Column {
                                  Text(
                                      "Coach's Tip",
                                      fontWeight = FontWeight.Bold,
                                      color = DeepPurple
                                  )
                                  Text(
                                      "Great queens are prepared, not just polished. Train confidence, communication and purpose.",
                                      fontSize = 13.sp,
                                      color = Color.DarkGray
                                  )
                              }
                          }
                      }
                  }

                  item {
                      TextButton(onClick = { onNavigate(AppScreen.SETTINGS) }) {
                          Text("Settings & App Information")
                      }
                  }
              }
          }

          @Composable
          fun DashboardStat(
              modifier: Modifier,
              number: String,
              label: String,
              icon: String,
              color: Color
          ) {
              Card(
                  modifier = modifier,
                  shape = RoundedCornerShape(22.dp),
                  colors = CardDefaults.cardColors(containerColor = Color.White)
              ) {
                  Column(modifier = Modifier.padding(18.dp)) {
                      Box(
                          modifier = Modifier
                              .size(42.dp)
                              .clip(CircleShape)
                              .background(color.copy(alpha = .12f)),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(icon, fontSize = 22.sp, color = color)
                      }
                      Spacer(Modifier.height(12.dp))
                      Text(
                          number,
                          fontSize = 25.sp,
                          fontWeight = FontWeight.Bold,
                          color = DeepPurple
                      )
                      Text(label, fontSize = 12.sp, color = Color.Gray)
                  }
              }
          }

          @Composable
          fun ActionCard(
              title: String,
              description: String,
              icon: String,
              color: Color,
              onClick: () -> Unit
          ) {
              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable { onClick() },
                  shape = RoundedCornerShape(22.dp),
                  colors = CardDefaults.cardColors(containerColor = Color.White),
                  elevation = CardDefaults.cardElevation(defaultElevation = 2.dp)
              ) {
                  Row(
                      modifier = Modifier.padding(18.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(
                          modifier = Modifier
                              .size(52.dp)
                              .clip(RoundedCornerShape(16.dp))
                              .background(color.copy(alpha = .12f)),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(icon, fontSize = 24.sp, color = color)
                      }
                      Spacer(Modifier.width(16.dp))
                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              title,
                              fontWeight = FontWeight.Bold,
                              fontSize = 16.sp,
                              color = DeepPurple
                          )
                          Spacer(Modifier.height(3.dp))
                          Text(description, fontSize = 12.sp, color = Color.Gray)
                      }
                      Text("›", fontSize = 28.sp, color = Color.Gray)
                  }
              }
          }

          @Composable
          fun PageHeader(title: String, subtitle: String, onBack: () -> Unit) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  IconButton(onClick = onBack) {
                      Text("‹", fontSize = 34.sp, color = DeepPurple)
                  }
                  Column {
                      Text(
                          title,
                          fontSize = 24.sp,
                          fontWeight = FontWeight.Bold,
                          color = DeepPurple
                      )
                      Text(subtitle, fontSize = 12.sp, color = Color.Gray)
                  }
              }
          }

          @Composable
          fun ContestantsScreen(onBack: () -> Unit) {
              var showAdd by remember { mutableStateOf(false) }
              var name by remember { mutableStateOf("") }
              val contestants = remember {
                  mutableStateListOf(
                      "Miss Gombe Junior",
                      "Mt St Mary's High School",
                      "Elite High School",
                      "Kyengera Parents"
                  )
              }

              Column(
                  modifier = Modifier.fillMaxSize().padding(20.dp)
              ) {
                  PageHeader(
                      "Contestants",
                      "Manage your queens and candidates",
                      onBack
                  )
                  Spacer(Modifier.height(18.dp))
                  Button(
                      modifier = Modifier.fillMaxWidth(),
                      onClick = { showAdd = true },
                      shape = RoundedCornerShape(16.dp)
                  ) {
                      Text("+", fontSize = 24.sp)
                      Spacer(Modifier.width(8.dp))
                      Text("Add New Contestant")
                  }
                  Spacer(Modifier.height(16.dp))
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      items(contestants) { contestant ->
                          ActionCard(
                              contestant,
                              "Contestant profile",
                              "●",
                              Purple
                          ) {}
                      }
                  }
              }

              if (showAdd) {
                  AlertDialog(
                      onDismissRequest = { showAdd = false },
                      title = { Text("Create Contestant Profile") },
                      text = {
                          OutlinedTextField(
                              value = name,
                              onValueChange = { name = it },
                              label = { Text("Contestant / School") },
                              singleLine = true
                          )
                      },
                      confirmButton = {
                          Button(onClick = {
                              if (name.isNotBlank()) contestants.add(name.trim())
                              name = ""
                              showAdd = false
                          }) {
                              Text("Save")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { showAdd = false }) {
                              Text("Cancel")
                          }
                      }
                  )
              }
          }

