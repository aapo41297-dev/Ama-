name: Build Pageant Coach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/amali/pageantcoach
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PageantCoach"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.amali.pageantcoach'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.amali.pageantcoach'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Pageant Coach">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8E24AA</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="24dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="PAGEANT COACH"
                      android:textSize="30sp"
                      android:textStyle="bold"
                      android:paddingBottom="8dp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Your all-in-one coaching platform"
                      android:textSize="18sp"
                      android:paddingBottom="24dp" />

                  <Button
                      android:id="@+id/btnContestants"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Contestants" />

                  <Button
                      android:id="@+id/btnTraining"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Training &amp; Coaching" />

                  <Button
                      android:id="@+id/btnProfiling"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Profiling &amp; Scripts" />

                  <Button
                      android:id="@+id/btnEvents"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Events &amp; Calendar" />

                  <Button
                      android:id="@+id/btnScores"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Scores &amp; Assessment" />

                  <Button
                      android:id="@+id/btnProjects"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Go Girl / Projects" />

                  <TextView
                      android:id="@+id/status"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Welcome, Coach. Version 1.0"
                      android:textSize="16sp"
                      android:paddingTop="24dp" />

              </LinearLayout>

          </ScrollView>
          EOF

          cat > app/src/main/java/com/amali/pageantcoach/MainActivity.java <<'EOF'
          package com.amali.pageantcoach;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  TextView status = findViewById(R.id.status);

                  setupButton(R.id.btnContestants, "Contestant management");
                  setupButton(R.id.btnTraining, "Training plans");
                  setupButton(R.id.btnProfiling, "Profiling and scripts");
                  setupButton(R.id.btnEvents, "Events and calendar");
                  setupButton(R.id.btnScores, "Scores and assessment");
                  setupButton(R.id.btnProjects, "Go Girl / project management");

                  status.setText(
                      "Welcome, Coach!\n\n" +
                      "Pageant Coach Version 1.0 is ready.\n" +
                      "More coaching tools will be added in future versions."
                  );
              }

              private void setupButton(int id, final String message) {
                  Button button = findViewById(id);

                  button.setOnClickListener(v ->
                      Toast.makeText(
                          MainActivity.this,
                          message,
                          Toast.LENGTH_SHORT
                      ).show()
                  );
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PageantCoach-V1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
